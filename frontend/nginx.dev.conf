server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Mashup uploads (audio up to MASHUP_MAX_SIZE + optional cover) pass through
    # here; keep this comfortably above the Go handler's own body caps.
    client_max_body_size 70m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/media/ {
        proxy_pass http://media-service:8100/v1/media/;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
    }

    # Mashup audio/covers go straight to media-service, never through Go.
    location /api/mashups/media/ {
        proxy_pass http://media-service:8100/v1/mashups/;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
