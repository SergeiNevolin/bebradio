server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    root /usr/share/nginx/html;
    index index.html;

    # Track uploads (audio up to MASHUP_MAX_SIZE + optional cover) pass through
    # here; keep this comfortably above the Go handler's own body caps.
    client_max_body_size 70m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # YouTube cache goes straight to music-service. Upload audio/covers are
    # served by the backend (/api/tracks/:id/audio|cover, streamed with
    # io.Copy), so they need no dedicated location: /api/ above handles them.
    location /api/music/ {
        proxy_pass http://music-service:8100/v1/music/;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
    }

    # ---- Караоке (karaoke-service, префикс /karaoke/) ----
    # resolver + переменная вместо статического proxy_pass: nginx должен
    # стартовать, даже если караоке-сервис ещё не поднят.
    resolver 127.0.0.11 ipv6=off;
    set $karaoke_upstream karaoke-service:8000;

    # /karaoke (без слэша) — React-маршрут bebradio, его нельзя отдать
    # караоке-прокси: иначе nginx вернёт 301 на /karaoke/ (auto-redirect
    # location-со-slash + proxy_pass) и iframe-страница не откроется
    location = /karaoke {
        try_files $uri $uri/ /index.html;
    }

    # аплоады треков до 1 ГБ: свой лимит тела, приём стримом без буферизации
    location /karaoke/api/upload {
        client_max_body_size 1024m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        rewrite ^/karaoke/api/upload(/.*)?$ /api/upload$1 break;
        proxy_pass http://$karaoke_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /karaoke/api/ {
        proxy_read_timeout 900s;
        rewrite ^/karaoke/api(/.*)?$ /api$1 break;
        proxy_pass http://$karaoke_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA плеера + статика песен (аудио отдаёт StaticFiles с Range)
    location /karaoke/ {
        rewrite ^/karaoke(/.*)$ $1 break;
        proxy_pass http://$karaoke_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
