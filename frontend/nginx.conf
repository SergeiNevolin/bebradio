# Прод-конфиг (Dockerfile.prod, :80/:443). Dev — nginx.dev.conf.
# Файл инклудится в http-контексте, поэтому upstream'ы — здесь же, сверху.

upstream be_backend {
    server backend:8000;
    keepalive 32;
}

upstream be_music {
    server music-service:8100;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Сжатие: JS/CSS/JSON/SVG по проводам в ~3 раза меньше ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Track uploads (audio up to MASHUP_MAX_SIZE + optional cover) pass through
    # here; keep this comfortably above the Go handler's own body caps.
    client_max_body_size 70m;

    location /api/ {
        proxy_pass http://be_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # YouTube cache goes straight to music-service. Upload audio/covers are
    # served by the backend (/api/tracks/:id/audio|cover, streamed with
    # io.Copy), so they need no dedicated location: /api/ above handles them.
    location /api/music/ {
        proxy_pass http://be_music/v1/music/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
    }

    # ---- Караоке (karaoke-service, единый префикс /api/karaoke/) ----
    # resolver + переменная вместо статического proxy_pass: nginx должен
    # стартовать, даже если караоке-сервис ещё не поднят.
    # NB: с переменной keepalive-пул невозможен — оставляем как есть.
    resolver 127.0.0.11 ipv6=off;
    set $karaoke_upstream karaoke-service:8000;

    # Всё караоке — через /api/karaoke/*: префикс срезается, дальше как есть
    # (/api/karaoke/api/* → /api/*, /api/karaoke/songs/* → /songs/*).
    # Перекрывает общий /api/ (длиннее префикс). Аплоады до 1 ГБ без буферизации.
    location /api/karaoke/ {
        client_max_body_size 1024m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        rewrite ^/api/karaoke(/.*)?$ $1 break;
        proxy_pass http://$karaoke_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Хешированные ассеты Vite — immutable на год, повторные визиты без запросов.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=604800";
    }

    # index.html и SPA-fallback — всегда ревалидация (иначе залипнет старая версия).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
