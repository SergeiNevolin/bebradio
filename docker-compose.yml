services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bebradio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    init: true
    restart: unless-stopped
    networks:
      - app-net

  silo:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    environment:
      - MINIO_ROOT_USER=siloadmin
      - MINIO_ROOT_PASSWORD=siloadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  music-service:
    build: ./music-service
    ports:
      - "8100:8100"
    environment:
      - S3_ENDPOINT=http://silo:9000
      - S3_ACCESS_KEY=siloadmin
      - S3_SECRET_KEY=siloadmin
      - S3_BUCKET=music
      - MASHUP_COVER_MAX_SIZE=5242880
      - BGUTIL_BASE_URL=http://bgutil-provider:4416
    depends_on:
      bgutil-provider:
        condition: service_started
      silo:
        condition: service_healthy
    networks:
      - app-net

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bebradio
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=dev-secret-key
      - CORS_ORIGINS=http://localhost:3000
      - MUSIC_SERVICE_URL=http://music-service:8100
      - MASHUP_MAX_SIZE=62914560
      - MASHUP_COVER_MAX_SIZE=5242880
      - MASHUP_USER_QUOTA=20
      - ADMIN_USERNAME=aboba
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      music-service:
        condition: service_started
    networks:
      - app-net

  karaoke-service:
    image: ${KARAOKE_IMAGE:-ghcr.io/serginevolin/karaoke:local}
    build:
      context: ${KARAOKE_SRC:-../karaoke}
      dockerfile: Dockerfile
      args:
        BASE_PATH: /karaoke/
        API_BASE: /karaoke
    restart: unless-stopped
    environment:
      # dev-бэкенд подписан жёстким dev-secret-key — караоке должен совпадать
      - AUTH_JWT_SECRET=${KARAOKE_AUTH_SECRET:-dev-secret-key}
      - KARAOKE_ML_SERVICE_URL=${KARAOKE_ML_SERVICE_URL:-http://host.docker.internal:8001}
      - LOG_LEVEL=${KARAOKE_LOG_LEVEL:-INFO}
      - MAX_UPLOAD_MB=${KARAOKE_MAX_UPLOAD_MB:-1024}
      # хранилище песен — общий Silo (бакет karaoke создаётся на старте)
      - S3_ENDPOINT=http://silo:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-siloadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-siloadmin}
      - S3_BUCKET=${KARAOKE_S3_BUCKET:-karaoke}
    depends_on:
      silo:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-net

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-80}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    environment:
      - BACKEND_URL=http://backend:8000
      - BACKEND_WS=ws://backend:8000
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  redisdata:
