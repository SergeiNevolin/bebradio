services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - e2e-pgdata:/var/lib/postgresql/data

  media-service:
    ports: !reset []
    volumes:
      - e2e-mediadata:/app/media

  backend:
    ports: !reset []
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bebradio
      SECRET_KEY: e2e-only-secret
      CORS_ORIGINS: http://127.0.0.1:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/api/rooms >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports: !override
      - "127.0.0.1:3000:80"
    volumes:
      - ./frontend/nginx.e2e.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  e2e-pgdata:
  e2e-mediadata: