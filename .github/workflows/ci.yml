name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -count=1 -timeout=60s

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  media-service-tests:
    name: Media Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-service

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: media-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  deploy:
    name: Deploy to Production
    runs-on: prod-runner
    needs: [backend-tests, frontend-tests, media-service-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  
    steps:
      - uses: actions/checkout@v5
  
      - name: Pull latest changes
        run: git pull origin main
  
      - name: Create .env file
        run: |
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env

      - name: Write TLS certificates
        env:
          SSL_KEY: ${{ secrets.SSL_KEY }}
          SSL_CERTIFICATE: ${{ secrets.SSL_CERTIFICATE }}
        run: |
          umask 077
          mkdir -p frontend/ssl
          printf '%s\n' "$SSL_KEY" > frontend/ssl/server.key
          printf '%s\n' "$SSL_CERTIFICATE" > frontend/ssl/server.crt
  
      - name: Build new images
        run: docker compose -f docker-compose.prod.yml build
      
      - name: Start new containers
        run: docker compose -f docker-compose.prod.yml up -d
  
      - name: Clean up unused images
        run: |
          docker image prune -f
          docker builder prune -af --filter "until=168h"
