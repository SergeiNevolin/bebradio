name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -count=1 -timeout=60s

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  music-service-tests:
    name: Music Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-service

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: music-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  e2e-tests:
    name: End-to-end Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, music-service-tests]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Typecheck E2E tests
        working-directory: frontend
        run: npm run typecheck:e2e

      - name: Build and start E2E environment
        run: docker compose -p bebradio-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Run E2E tests
        working-directory: frontend
        run: E2E_BASE_URL=http://127.0.0.1:3000 npm run test:e2e

      - name: Collect container logs
        if: failure()
        run: docker compose -p bebradio-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color

      - name: Tear down E2E environment
        if: always()
        run: docker compose -p bebradio-e2e -f docker-compose.yml -f docker-compose.e2e.yml down -v --remove-orphans

  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Create .env file
        run: |
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}" >> .env
          echo "KARAOKE_ML_SERVICE_URL=${{ secrets.KARAOKE_ML_SERVICE_URL }}" >> .env
          echo "KARAOKE_IMAGE=${{ secrets.KARAOKE_IMAGE }}" >> .env

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (sha tag)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose -f docker-compose.prod.yml build backend frontend music-service
          docker compose -f docker-compose.prod.yml push backend frontend music-service

      - name: Build and push (main tag)
        run: |
          docker compose -f docker-compose.prod.yml build backend frontend music-service
          docker compose -f docker-compose.prod.yml push backend frontend music-service

  deploy:
    name: Deploy to Production
    runs-on: prod-runner
    needs: [build-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
  
    steps:
      - uses: actions/checkout@v5
  
      - name: Pull latest changes
        run: git pull origin main
  
      - name: Create .env file
        run: |
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}" >> .env
          echo "KARAOKE_ML_SERVICE_URL=${{ secrets.KARAOKE_ML_SERVICE_URL }}" >> .env
          echo "KARAOKE_IMAGE=${{ secrets.KARAOKE_IMAGE }}" >> .env
          echo "IMAGE_TAG=${{ github.sha }}" >> .env

      - name: Log in to GHCR (караоке-образ тянется оттуда)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write TLS certificates
        env:
          SSL_KEY: ${{ secrets.SSL_KEY }}
          SSL_CERTIFICATE: ${{ secrets.SSL_CERTIFICATE }}
        run: |
          umask 077
          mkdir -p frontend/ssl
          printf '%s\n' "$SSL_KEY" > frontend/ssl/server.key
          printf '%s\n' "$SSL_CERTIFICATE" > frontend/ssl/server.crt
  
      - name: Pull images
        run: docker compose -p bebradio -f docker-compose.prod.yml pull backend frontend music-service karaoke-service
      
      - name: Start new containers
        run: docker compose -p bebradio -f docker-compose.prod.yml up -d
  
      - name: Clean up unused images
        run: |
          docker image prune -f
          docker builder prune -af --filter "until=168h"
